# =============================================================================
# Phase 6 — Production Hardened Local Compose (Option C)
# The Lenny Growth Assistant
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 0. Local Ollama LLM Service
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: lenny-prod-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - lenny_prod_ollama:/root/.ollama
    networks:
      - lenny-network

  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database (Private / Internal Network Only)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lenny-prod-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: lenny
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_dev_password}
    volumes:
      - lenny_prod_pgdata:/var/lib/postgresql/data
    networks:
      - lenny-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Pi Agent Service (Private / Internal Network Only)
  # ---------------------------------------------------------------------------
  pi-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: lenny-prod-pi-agent
    restart: unless-stopped
    environment:
      PI_AGENT_PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lenny-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. FastAPI Backend & Static Frontend (Public Host Access on :8000)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: lenny-prod-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lenny:${POSTGRES_PASSWORD:-lenny_dev_password}@postgres:5432/lenny
      PI_AGENT_URL: http://pi-agent:3001
      PI_AGENT_PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ARTIFACT_SANITIZATION_MODE: ${ARTIFACT_SANITIZATION_MODE:-sanitize}
      ALLOWED_ORIGINS: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      pi-agent:
        condition: service_healthy
    networks:
      - lenny-network

networks:
  lenny-network:
    driver: bridge

volumes:
  lenny_prod_pgdata:
  lenny_prod_ollama:
