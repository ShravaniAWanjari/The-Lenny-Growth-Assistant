services:
  # ---------------------------------------------------------------------------
  # 0. Local Ollama LLM Service
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: lenny-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - lenny-network

  # Pull the configured local model into the persistent Ollama volume on the
  # first startup. Subsequent startups reuse the downloaded model.
  ollama-init:
    image: ollama/ollama:latest
    container_name: lenny-ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$${OLLAMA_MODEL}"
    networks:
      - lenny-network

  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lenny-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lenny
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lenny-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Pi Agent Service
  # ---------------------------------------------------------------------------
  pi-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: lenny-pi-agent
    restart: unless-stopped
    environment:
      PI_AGENT_PORT: 3001
      FASTAPI_URL: http://backend:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    networks:
      - lenny-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. FastAPI Backend & Static Frontend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: lenny-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lenny:${POSTGRES_PASSWORD:-lenny_dev_password}@postgres:5432/lenny
      PI_AGENT_URL: http://pi-agent:3001
      PI_AGENT_PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ARTIFACT_SANITIZATION_MODE: ${ARTIFACT_SANITIZATION_MODE:-sanitize}
      ALLOWED_ORIGINS: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      pi-agent:
        condition: service_healthy
    networks:
      - lenny-network

networks:
  lenny-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
